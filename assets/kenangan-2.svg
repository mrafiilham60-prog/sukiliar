<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1125" role="img" aria-label="Ilustrasi secangkir kopi dan buku di atas meja kayu">
  <defs>
    <linearGradient id="table" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c58c5f"/>
      <stop offset="0.45" stop-color="#a76f46"/>
      <stop offset="1" stop-color="#7c4c2d"/>
    </linearGradient>
    <radialGradient id="light" cx="25%" cy="18%" r="85%">
      <stop offset="0" stop-color="#ffe2b5" stop-opacity="0.8"/>
      <stop offset="0.45" stop-color="#f3bc87" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#5f351e" stop-opacity="0.3"/>
    </radialGradient>
    <linearGradient id="saucer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7e9d2"/>
      <stop offset="1" stop-color="#d9bc9a"/>
    </linearGradient>
    <radialGradient id="cup" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#d1735d"/>
      <stop offset="1" stop-color="#9b3f39"/>
    </radialGradient>
    <radialGradient id="coffee" cx="48%" cy="40%" r="65%">
      <stop offset="0" stop-color="#8e5837"/>
      <stop offset="0.62" stop-color="#5b301f"/>
      <stop offset="1" stop-color="#30170f"/>
    </radialGradient>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8edda"/>
      <stop offset="1" stop-color="#ddc7aa"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="48%" r="73%">
      <stop offset="0.55" stop-color="#371d0f" stop-opacity="0"/>
      <stop offset="1" stop-color="#2d160b" stop-opacity="0.52"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="900" height="1125" fill="url(#table)"/>

  <!-- Serat kayu -->
  <g fill="none" stroke="#6f4227" stroke-width="2" opacity="0.25">
