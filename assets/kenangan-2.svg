  <g>
    <path d="M780 558c67 8 104 43 100 100-4 55-47 85-110 82" fill="none" stroke="#a54b42" stroke-width="57" stroke-linecap="round"/>
    <path d="M780 558c67 8 104 43 100 100-4 55-47 85-110 82" fill="none" stroke="#d9b18e" stroke-width="35" stroke-linecap="round" opacity="0.42"/>
    <ellipse cx="600" cy="618" rx="186" ry="174" fill="#71382f" opacity="0.25" filter="url(#shadow)"/>
    <ellipse cx="600" cy="590" rx="187" ry="174" fill="#a8483f"/>
    <ellipse cx="600" cy="579" rx="184" ry="171" fill="url(#cup)"/>
    <ellipse cx="600" cy="578" rx="156" ry="143" fill="#e8d1b8"/>
    <ellipse cx="600" cy="580" rx="144" ry="131" fill="url(#coffee)"/>
    <ellipse cx="588" cy="553" rx="88" ry="67" fill="#c58c62" opacity="0.33" filter="url(#shadow)"/>
    <path d="M509 588c45-44 113-61 180-28 24 12 36 35 31 55-29 31-88 46-144 33-43-10-75-33-67-60Z" fill="#c19266" opacity="0.42"/>
    <path d="M526 598c37-34 92-43 138-19 19 10 28 27 20 41-33 22-83 24-125 7-22-9-40-19-33-29Z" fill="#e2b985" opacity="0.18"/>
    <ellipse cx="600" cy="579" rx="145" ry="132" fill="none" stroke="#3c1d12" stroke-width="4" opacity="0.55"/>
    <path d="M455 520c42-51 113-72 182-52" fill="none" stroke="#f3c7a0" stroke-width="5" stroke-linecap="round" opacity="0.22"/>
  </g>

  <!-- Sendok -->
  <g transform="rotate(-27 759 815)">
    <rect x="746" y="690" width="12" height="264" rx="6" fill="url(#saucer)"/>
    <ellipse cx="752" cy="690" rx="25" ry="47" fill="#e7d4bd"/>
    <ellipse cx="752" cy="688" rx="18" ry="36" fill="#d5bea4"/>
