    <path d="M0 195c149-33 273-32 391-3 123 30 240 24 354-8 54-15 105-19 155-12"/>
    <path d="M0 315c123 18 249 13 365-12 130-28 250-21 363 11 61 17 117 22 172 15"/>
    <path d="M0 482c141-14 252-8 357 19 111 28 219 23 326-5 78-21 150-22 217-4"/>
    <path d="M0 681c126 22 237 16 340-11 123-32 238-24 346 10 78 25 149 26 214 6"/>
    <path d="M0 844c161-28 286-23 396 8 109 30 219 24 330-11 64-20 122-22 174-7"/>
    <path d="M0 1002c130 22 250 19 360-7 115-27 235-19 349 13 71 20 134 21 191 8"/>
  </g>
  <g fill="none" stroke="#e3b182" stroke-width="1" opacity="0.2">
