    <path d="M0 558c150-28 265-22 375 10 107 31 225 26 340-7 71-20 132-19 185 0"/>
    <path d="M0 932c138-20 259-13 370 14 114 28 225 23 332-10 71-22 134-23 198-7"/>
  </g>

  <rect width="900" height="1125" fill="url(#light)"/>

  <!-- Bayangan besar -->
  <ellipse cx="584" cy="681" rx="291" ry="236" fill="#3e1f0e" opacity="0.38" filter="url(#softShadow)" transform="rotate(-12 584 681)"/>
  <ellipse cx="339" cy="709" rx="238" ry="217" fill="#3e1f0e" opacity="0.28" filter="url(#softShadow)" transform="rotate(12 339 709)"/>

  <!-- Buku -->
  <g transform="rotate(-9 330 648)">
    <rect x="102" y="414" width="398" height="474" rx="14" fill="#38221b"/>
    <rect x="116" y="424" width="370" height="452" rx="10" fill="#603a2d"/>
    <path d="M122 436h354v423l-177-19-177 19Z" fill="url(#page)"/>
    <path d="M299 438v419" stroke="#bda17e" stroke-width="7" opacity="0.7"/>
    <path d="M299 438v419" stroke="#8b6a4e" stroke-width="1.2" opacity="0.5"/>
    <g stroke="#927055" stroke-width="3" stroke-linecap="round" opacity="0.47">
      <path d="M154 491h104M154 514h92M154 537h105M154 560h76"/>
      <path d="M342 491h105M342 514h82M342 537h96M342 560h68"/>
      <path d="M154 621h101M154 644h87M154 667h104M154 690h58"/>
      <path d="M342 621h98M342 644h106M342 667h63"/>
      <path d="M154 750h112M154 773h86M342 750h91M342 773h56"/>
    </g>
    <path d="M116 868c109-24 232-24 370 0" fill="none" stroke="#4a2e22" stroke-width="7" opacity="0.38"/>
    <path d="M285 468c9 6 19 6 28 0" fill="none" stroke="#c4554e" stroke-width="4" stroke-linecap="round"/>
  </g>

