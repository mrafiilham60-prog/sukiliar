  <!-- Ranting kering -->
  <g fill="none" stroke="#6f7b4b" stroke-width="4" stroke-linecap="round">
    <path d="M680 1060c-8-94 4-175 34-243"/>
    <path d="M707 924c20-14 38-16 54-8M697 983c-21-4-38 1-51 14M717 870c15-15 31-20 47-16M690 1015c-20-2-35 5-45 18"/>
  </g>
  <g fill="#7c8753">
