    <ellipse cx="650" cy="997" rx="21" ry="10" transform="rotate(28 650 997)"/>
    <ellipse cx="762" cy="857" rx="20" ry="10" transform="rotate(-31 762 857)"/>
    <ellipse cx="648" cy="1033" rx="17" ry="8" transform="rotate(34 648 1033)"/>
