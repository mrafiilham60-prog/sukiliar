  <path d="M120 872c93-42 191-40 286 4 70 32 82 96 28 141-68 56-188 42-267-12-61-42-84-99-47-133Z" fill="#d7b9a0" opacity="0.82"/>
  <path d="M144 895c62-25 130-18 190 20M128 935c72-29 150-20 219 25M160 981c48-18 97-13 143 12" fill="none" stroke="#b18c70" stroke-width="2" opacity="0.42"/>

  <!-- Tatakan -->
  <g>
    <ellipse cx="600" cy="654" rx="244" ry="237" fill="#4d2a14" opacity="0.3" filter="url(#shadow)"/>
    <ellipse cx="600" cy="625" rx="241" ry="232" fill="url(#saucer)"/>
    <ellipse cx="600" cy="618" rx="230" ry="218" fill="#f9efdf"/>
    <ellipse cx="600" cy="620" rx="213" ry="200" fill="#ead5bb"/>
    <ellipse cx="600" cy="614" rx="204" ry="191" fill="url(#saucer)"/>
    <ellipse cx="600" cy="610" rx="190" ry="178" fill="#f2e2cb"/>
