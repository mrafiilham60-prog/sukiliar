<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1125" role="img" aria-label="Ilustrasi matahari terbenam di atas perbukitan">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f435f"/>
      <stop offset="0.24" stop-color="#9d5d70"/>
      <stop offset="0.5" stop-color="#d7776c"/>
      <stop offset="0.74" stop-color="#f2aa71"/>
      <stop offset="1" stop-color="#f7ce96"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff3c7" stop-opacity="1"/>
      <stop offset="0.22" stop-color="#ffe2a0" stop-opacity="0.92"/>
      <stop offset="0.55" stop-color="#f6af6f" stop-opacity="0.33"/>
      <stop offset="1" stop-color="#ef9869" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mountainBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9d5a66"/>
      <stop offset="1" stop-color="#774251"/>
    </linearGradient>
    <linearGradient id="mountainMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#633847"/>
      <stop offset="1" stop-color="#4b2b3b"/>
    </linearGradient>
    <linearGradient id="mountainFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b252f"/>
      <stop offset="1" stop-color="#24181f"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#35252a"/>
      <stop offset="1" stop-color="#171216"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="43%" r="74%">
      <stop offset="0.55" stop-color="#1d1218" stop-opacity="0"/>
      <stop offset="1" stop-color="#150e12" stop-opacity="0.6"/>
    </radialGradient>
    <filter id="blur20"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="900" height="1125" fill="url(#sky)"/>

  <!-- Awan tipis -->
  <g fill="#ffd9b3" opacity="0.16" filter="url(#blur8)">
    <ellipse cx="220" cy="311" rx="250" ry="26" transform="rotate(-6 220 311)"/>
    <ellipse cx="712" cy="240" rx="270" ry="21" transform="rotate(4 712 240)"/>
    <ellipse cx="468" cy="391" rx="330" ry="17" transform="rotate(-3 468 391)"/>
    <ellipse cx="135" cy="507" rx="230" ry="18" transform="rotate(5 135 507)"/>
  </g>

  <!-- Cahaya matahari -->
  <circle cx="575" cy="560" r="290" fill="url(#sunGlow)"/>
  <circle cx="575" cy="562" r="96" fill="#ffe5a2" opacity="0.33" filter="url(#blur20)"/>
  <circle cx="575" cy="560" r="57" fill="#ffe9ae"/>
  <circle cx="575" cy="560" r="34" fill="#fff7d4" opacity="0.65" filter="url(#blur8)"/>

  <!-- Awan depan, hangat -->
  <g fill="#f6b785" opacity="0.24">
    <path d="M0 664c104-35 197-35 286-7 80 25 140 14 199-15 77-38 173-22 240 14 50 27 108 32 175 18v64H0Z" filter="url(#blur8)"/>
  </g>

  <!-- Gunung belakang -->
  <path d="M0 693c80-63 150-106 232-84 70 19 103 73 171 63 70-10 127-93 214-92 79 2 131 76 283 70v228H0Z" fill="url(#mountainBack)"/>
  <path d="M0 759c116-85 206-105 308-74 87 26 146 73 239 22 73-40 133-32 202-1 57 26 105 23 151 8v178H0Z" fill="url(#mountainMid)"/>
  <path d="M0 838c139-82 238-80 340-45 106 36 170 19 262-24 96-45 181-26 298 40v105H0Z" fill="url(#mountainFront)"/>

  <!-- Burung -->
  <g fill="none" stroke="#38232b" stroke-width="3.6" stroke-linecap="round" opacity="0.86">
    <path d="M650 320c9-8 17-8 25 0 8-8 17-8 25 0"/>
    <path d="M706 355c7-6 13-6 18 0 6-6 12-6 18 0" stroke-width="2.8"/>
    <path d="M590 378c6-5 11-5 16 0 5-4 10-4 15 0" stroke-width="2.4"/>
  </g>

  <!-- Padang rumput -->
  <path d="M0 935c128-37 230-50 322-27 103 26 175 22 252-8 114-43 216-27 326 15v210H0Z" fill="url(#field)"/>
  <g stroke="#a67558" stroke-width="2" opacity="0.52">
    <path d="M102 1070c-3-57 7-102 30-142"/>
    <path d="M121 1069c3-48 17-89 42-121"/>
    <path d="M72 1060c4-40 17-75 39-102"/>
    <path d="M285 1100c-2-52 7-91 26-126"/>
    <path d="M319 1092c4-46 17-83 38-110"/>
    <path d="M675 1089c-2-52 8-98 30-137"/>
    <path d="M715 1101c4-57 20-101 45-134"/>
    <path d="M804 1108c-1-47 10-87 32-121"/>
    <path d="M547 1103c1-45 13-82 35-111"/>
  </g>
  <g stroke="#e6aa76" stroke-width="1.6" opacity="0.38">
    <path d="M145 956c5-42 21-72 47-95"/>
    <path d="M232 972c2-34 13-64 33-89"/>
    <path d="M651 956c4-38 17-68 39-91"/>
    <path d="M784 971c2-38 15-68 38-91"/>
  </g>

  <!-- Siluet rumput dekat kamera -->
  <g fill="#130f12">
    <path d="M0 1125V1013c48-22 82-63 106-120 6 72-9 129-37 170-13 19-19 41-18 62Z"/>
    <path d="M900 1125V992c-55-15-98-57-126-116-5 70 18 131 58 176 15 17 23 44 23 73Z"/>
    <path d="M341 1125c8-69 32-117 72-147-15 55-19 104-11 147Z" opacity="0.85"/>
    <path d="M585 1125c-2-73 13-123 45-159 2 57 9 109 28 159Z" opacity="0.85"/>
  </g>

  <rect width="900" height="1125" fill="url(#vignette)"/>
  <rect width="900" height="1125" filter="url(#grain)" opacity="0.16" style="mix-blend-mode:soft-light"/>
</svg>
