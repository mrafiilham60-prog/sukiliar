    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff4c9" stop-opacity="0.95"/>
      <stop offset="0.32" stop-color="#f5d08f" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#e9bc77" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="petalCream" cx="45%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fff8e8"/>
      <stop offset="1" stop-color="#e8d3b1"/>
