    <path d="M824 428v487" stroke="#0d0e16" stroke-width="9"/>
    <path d="M824 428h-45" stroke="#0d0e16" stroke-width="8"/>
    <circle cx="770" cy="428" r="48" fill="#f6c27a" opacity="0.15" filter="url(#blur8)"/>
    <circle cx="770" cy="428" r="12" fill="#ffdd9d"/>
    <circle cx="770" cy="428" r="7" fill="#fff5d4"/>
