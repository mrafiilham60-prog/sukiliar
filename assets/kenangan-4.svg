  <path d="M0 143c150 74 277 80 390 25 100-49 193-48 290 0 74 36 147 46 220 31" fill="none" stroke="#0e1020" stroke-width="2" opacity="0.7"/>

  <!-- Asap tipis -->
  <path d="M323 753c-20-42 29-66 10-112-12-29-5-57 19-83" fill="none" stroke="#b9a8af" stroke-width="14" stroke-linecap="round" opacity="0.05" filter="url(#blur8)"/>

  <rect width="900" height="1125" fill="url(#vignette)"/>
  <rect width="900" height="1125" filter="url(#grain)" opacity="0.17" style="mix-blend-mode:soft-light"/>
</svg>
