<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preview — Love Bone Background</title>
  <style>
    * { margin: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #1a0f15;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3rem;
      padding: 2rem;
      font-family: sans-serif;
      color: #f7eddb;
      overflow-x: hidden;
    }

    h2 {
      text-align: center;
      font-size: 1.2rem;
      opacity: 0.6;
      margin-bottom: -1.5rem;
    }

    .preview-box {
      position: relative;
      width: min(420px, 90vw);
      aspect-ratio: 3/4;
      border: 1px solid rgba(247,237,219,0.15);
      border-radius: 12px;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 45%, rgba(144,69,58,0.28), transparent 42%),
        radial-gradient(circle at 14% 24%, rgba(191,138,80,0.1), transparent 30%),
        radial-gradient(circle at 85% 72%, rgba(93,39,51,0.28), transparent 34%),
        #1a0f15;
    }

    /* ============================================
       STYLE 1 — Outline hearts (garis tipis)
       ============================================ */
    .style1 .bone-heart {
      position: absolute;
      opacity: 0.07;
      animation: float-heart 18s ease-in-out infinite alternate;
    }

    .style1 .bone-heart svg {
      width: 100%;
      height: 100%;
    }

    .style1 .h1 { width: 120px; top: 8%;  left: 5%;  animation-delay: 0s; }
    .style1 .h2 { width: 80px;  top: 25%; right: 8%; animation-delay: -3s; transform: rotate(15deg); }
    .style1 .h3 { width: 60px;  top: 55%; left: 12%; animation-delay: -7s; transform: rotate(-20deg); }
    .style1 .h4 { width: 100px; bottom: 12%; right: 5%; animation-delay: -5s; transform: rotate(10deg); }
    .style1 .h5 { width: 45px;  top: 40%; right: 25%; animation-delay: -9s; transform: rotate(-10deg); }
    .style1 .h6 { width: 70px;  bottom: 30%; left: 30%; animation-delay: -12s; transform: rotate(25deg); }

    /* ============================================
       STYLE 2 — X-ray / skeletal hearts (lebih detail)
       ============================================ */
    .style2 .bone-heart {
      position: absolute;
      opacity: 0.06;
      animation: float-heart 20s ease-in-out infinite alternate;
    }

    .style2 .bone-heart svg {
      width: 100%;
      height: 100%;
    }

    .style2 .h1 { width: 130px; top: 5%;  left: 3%;  animation-delay: 0s; }
    .style2 .h2 { width: 70px;  top: 20%; right: 10%; animation-delay: -4s; transform: rotate(20deg); }
    .style2 .h3 { width: 55px;  top: 50%; left: 8%;  animation-delay: -8s; transform: rotate(-15deg); }
    .style2 .h4 { width: 95px;  bottom: 8%; right: 3%; animation-delay: -6s; transform: rotate(12deg); }
    .style2 .h5 { width: 40px;  top: 35%; right: 30%; animation-delay: -10s; transform: rotate(-8deg); }
    .style2 .h6 { width: 65px;  bottom: 25%; left: 25%; animation-delay: -13s; transform: rotate(18deg); }

    /* ============================================
       STYLE 3 — Scattered bone hearts (banyak, kecil-kecil)
       ============================================ */
    .style3 .bone-heart {
      position: absolute;
      opacity: 0.05;
      animation: float-heart 22s ease-in-out infinite alternate;
    }

    .style3 .bone-heart svg {
      width: 100%;
      height: 100%;
    }

    .style3 .h1  { width: 90px;  top: 3%;   left: 2%;   animation-delay: 0s; }
    .style3 .h2  { width: 50px;  top: 10%;  right: 15%; animation-delay: -2s;  transform: rotate(30deg); }
    .style3 .h3  { width: 35px;  top: 22%;  left: 20%;  animation-delay: -5s;  transform: rotate(-25deg); }
    .style3 .h4  { width: 75px;  top: 35%;  right: 5%;  animation-delay: -3s;  transform: rotate(15deg); }
    .style3 .h5  { width: 45px;  top: 48%;  left: 8%;   animation-delay: -7s;  transform: rotate(-10deg); }
    .style3 .h6  { width: 60px;  top: 58%;  right: 20%; animation-delay: -9s;  transform: rotate(22deg); }
    .style3 .h7  { width: 40px;  top: 70%;  left: 30%;  animation-delay: -11s; transform: rotate(-18deg); }
    .style3 .h8  { width: 80px;  bottom: 8%; right: 2%;  animation-delay: -6s;  transform: rotate(8deg); }
    .style3 .h9  { width: 30px;  bottom: 20%; left: 5%;  animation-delay: -14s; transform: rotate(35deg); }
    .style3 .h10 { width: 55px;  top: 15%;  left: 50%;  animation-delay: -16s; transform: rotate(-5deg); }

    @keyframes float-heart {
      0%   { transform: translateY(0px) rotate(var(--r, 0deg)); }
      50%  { transform: translateY(-8px) rotate(var(--r, 0deg)); }
      100% { transform: translateY(4px) rotate(var(--r, 0deg)); }
    }

    /* Label */
    .label {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.75rem;
      opacity: 0.4;
      white-space: nowrap;
    }
  </style>
</head>
