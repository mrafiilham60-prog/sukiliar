<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7efe3">
<title>Selamat ulang tahun, kak</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Leckerli+One&family=Pacifico&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Yellowtail&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="paperRain" class="paper-rain" aria-hidden="true"></canvas>

<section class="cover" id="cover" aria-label="Pembuka">
  <!-- 📸 FOTO SAMPUL / COVER (Ganti 'assets/foto2.webp' di bawah ini) -->
  <div class="pol">
    <img src="assets/foto7.webp.webp" alt="Foto Sampul" width="1080" height="1080">
  </div>
  <h1>Ada kejutan kecil buat kamu</h1>
  <button class="open" id="open" type="button">Buka kejutan</button>
  <p>Nyalakan suara, ada lagunya.</p>
</section>

<header class="intro">
<div class="header-container">
  <div class="typo-badge">
    <h1 class="title-typography">
      <span class="typo-main typo-top"><i style="--d:.35s">Selamat</i></span>
      <span class="typo-banner"><i style="--d:.5s">ULANG TAHUN</i></span>
      <span class="typo-main typo-bottom"><i style="--d:.65s">kak<b>♡</b></i></span>
      <span class="typo-sub"><i style="--d:.8s">SPESIAL UNTUKMU</i></span>
    </h1>
  </div>
</div>
  <p class="wish" id="wish" aria-hidden="true"></p>
</header>

<main class="rain" id="rain" aria-label="Foto kenangan"></main>

<audio id="song" loop preload="auto" src="assets/SpotiDown.App - Diri - Tulus.mp3"></audio>

<div class="dock" id="dock" hidden>
  <div class="disc" aria-hidden="true"></div>
  <div class="meta"><b>Diri</b><span id="sub">Tulus</span></div>
  <button class="play" id="play" type="button" aria-label="Putar musik" aria-pressed="false">
    <svg class="pl" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
    <svg class="pa" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
  </button>
  <div class="prog" aria-hidden="true"><b id="progress"></b></div>
</div>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Foto kenangan" inert>
  <div class="stage" id="stage"><figure class="frame" id="frame"><img id="lbImg" alt=""></figure></div>
  <button class="round x" id="lbClose" type="button" aria-label="Tutup foto"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  <div class="bar">
    <button class="round" id="lbPrev" type="button" aria-label="Foto sebelumnya"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <p id="lbCount" aria-live="polite"></p>
    <button class="round" id="lbNext" type="button" aria-label="Foto berikutnya"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
</div>

<script src="assets/confetti.browser.min.js"></script>
<script src="script.js" defer></script>
</body>
</html>
