<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a0f15">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="Hujan foto kenangan yang naik dari bawah.">
  <title>Kenangan</title>

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700&family=Caveat:wght@400;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="greeting" aria-label="Panjang Umur, kawann!">
    <h1 class="greeting__title">
      <span class="greeting__hbd">Panjang Umur,</span>
      <span class="greeting__name">kawann!</span>
    </h1>
  </header>

  <main class="rain" id="rain" aria-label="Hujan foto kenangan"></main>

  <audio id="song" loop preload="auto" playsinline>
    <source src="assets/diri-tulus.mp3" type="audio/mpeg">
    <source src="assets/lagu.wav" type="audio/wav">
  </audio>

  <button class="music" id="musicToggle" type="button" aria-label="Putar musik" aria-pressed="false" hidden>
    <svg class="music__icon music__icon--on" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M9 17.5V6.2l9-1.8v10.7" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      <ellipse cx="6.6" cy="17.6" rx="2.7" ry="2.25" fill="currentColor"/>
      <ellipse cx="15.6" cy="15.8" rx="2.7" ry="2.25" fill="currentColor"/>
    </svg>
    <svg class="music__icon music__icon--off" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M9 17.5V6.2l9-1.8v10.7" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      <ellipse cx="6.6" cy="17.6" rx="2.7" ry="2.25" fill="currentColor"/>
      <ellipse cx="15.6" cy="15.8" rx="2.7" ry="2.25" fill="currentColor"/>
      <path d="M4 4.5 20 20" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
  </button>

  <div class="viewer" id="photoViewer" role="dialog" aria-modal="true" aria-label="Foto kenangan" aria-hidden="true" inert>
    <div class="viewer__backdrop" id="viewerBackdrop"></div>
    <figure class="viewer__frame">
      <img id="viewerImage" src="" alt="">
    </figure>
    <button class="viewer__close" id="viewerClose" type="button" aria-label="Tutup foto">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
