  <!-- Rose Petals & Explosion Canvases -->
  <canvas id="petalsCanvas" class="petals-canvas" aria-hidden="true"></canvas>
  <canvas id="burstCanvas" class="burst-canvas" aria-hidden="true"></canvas>

  <main class="rain" id="rain" aria-label="Hujan foto kenangan"></main>

  <div class="start-hint" id="startHint" aria-hidden="true">Tekan vinyl 👇</div>

  <audio id="song" loop preload="auto" playsinline>
    <source src="assets/diri-tulus.mp3" type="audio/mpeg">
    <source src="assets/lagu.wav" type="audio/wav">
  </audio>

  <button class="music" id="musicToggle" type="button" aria-label="Putar musik" aria-pressed="false" hidden>
    <div class="vinyl-disc" aria-hidden="true"></div>
    <div class="vinyl-info" aria-hidden="true">
      <span class="vinyl-song">Diri</span>
      <span class="vinyl-artist">Tulus 🎵</span>
    </div>
    <div class="vinyl-bars" aria-hidden="true">
      <div class="vinyl-bar"></div>
      <div class="vinyl-bar"></div>
      <div class="vinyl-bar"></div>
      <div class="vinyl-bar"></div>
    </div>
  </button>

  <div class="viewer" id="photoViewer" role="dialog" aria-modal="true" aria-label="Foto kenangan" aria-hidden="true" inert>
    <div class="viewer__backdrop" id="viewerBackdrop"></div>
    <figure class="viewer__frame">
      <img id="viewerImage" src="" alt="">
    </figure>
